<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2FA Authenticator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha.js"></script>
<style>
*{
box-sizing: border-box;
margin: 0;
padding: 0;
}
body{
font-family: 'Segoe UI', Arial, sans-serif;
padding: 20px;
background: #0d0e12;
color: #e4e6eb;
line-height: 1.5;
}
.container {
max-width: 700px;
margin: 0 auto;
background: #16181f;
padding: 25px;
border-radius: 16px;
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
border: 1px solid #2a2d38;
}
h2{
font-size: 22px;
font-weight: 600;
margin-bottom: 5px;
color: #fff;
letter-spacing: 0.5px;
}
.subtitle {
font-size: 13px;
color: #8a8f9d;
margin-bottom: 15px;
}
textarea{
width: 100%;
height: 160px;
background: #1f222e;
color: #39e58e;
border: 1.5px solid #2d3142;
padding: 14px;
font-size: 14px;
font-family: 'Fira Code', monospace;
border-radius: 10px;
resize: vertical;
outline: none;
transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus{
border-color: #0a84ff;
box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
}
.control-panel {
margin-top: 15px;
display: flex;
flex-direction: column;
gap: 10px;
}
.limit-box {
display: flex;
align-items: center;
gap: 10px;
background: #1f222e;
padding: 10px 14px;
border-radius: 10px;
border: 1px solid #2d3142;
}
.limit-box label {
font-size: 14px;
color: #8a8f9d;
white-space: nowrap;
}
.limit-box input {
flex: 1;
background: #16181f;
border: 1px solid #3f4458;
color: #ff9f0a;
padding: 8px 12px;
font-size: 15px;
font-weight: 600;
border-radius: 6px;
outline: none;
}
.btn-group {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
button{
width: 100%;
padding: 14px;
font-size: 15px;
font-weight: 600;
border: none;
background: #0a84ff;
color: #fff;
border-radius: 10px;
cursor: pointer;
transition: background 0.2s, transform 0.1s, filter 0.2s;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}
button:hover{
filter: brightness(1.1);
}
button:active{
transform: scale(0.98);
}
.btn-new {
background: #0a84ff;
}
.btn-continue {
background: #24b45a;
}
.btn-copy {
grid-column: span 2;
background: #2f3342;
color: #e4e6eb;
border: 1px solid #3f4458;
margin-top: 5px;
}
.btn-copy:hover {
background: #3f4458;
}
#counter {
margin-top: 20px;
font-size: 14px;
font-weight: 600;
color: #ff9f0a;
background: rgba(255, 159, 10, 0.08);
padding: 10px 15px;
border-radius: 8px;
border: 1px solid rgba(255, 159, 10, 0.2);
display: inline-block;
}
#out{
margin-top: 15px;
background: #1f222e;
border-radius: 10px;
max-height: 350px;
overflow: auto;
border: 1px solid #2d3142;
}
.line-item {
padding: 10px 14px;
border-bottom: 1px solid #2d3142;
cursor: pointer;
font-family: monospace;
font-size: 13px;
color: #cbd5e1;
transition: background 0.15s, color 0.15s;
}
.line-item:last-child {
border-bottom: none;
}
.line-item:hover {
background: #262938;
color: #0a84ff;
}
#toast {
position: fixed;
bottom: -50px;
right: 20px;
background: #0a84ff;
color: #fff;
padding: 12px 24px;
border-radius: 8px;
font-size: 14px;
font-weight: 600;
z-index: 1000;
transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#toast.show {
bottom: 20px;
}
</style>

<style>
:container{
    max-width:900px;
    margin:auto;
    background:var(--card);
    padding:24px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}
h2{text-align:center;margin-bottom:14px}

.tabs{
    display:flex;
    gap:6px;
    background:#e5e7eb;
    padding:6px;
    border-radius:999px;
}
.tab{
    flex:1;
    padding:10px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
    border-radius:999px;
}
.tab.active{
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.tab-content{display:none;margin-top:20px}
.tab-content.active{display:block}

input,textarea{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    margin-top:10px;
}
.big-code{
    font-size:3em;
    font-weight:800;
    text-align:center;
    margin-top:20px;
    cursor:pointer;
}
.count{text-align:center;color:var(--muted)}

button{
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}
.btn-save{background:var(--primary);color:#fff}
.btn-copy{background:var(--blue);color:#fff}
.btn-del{background:var(--red);color:#fff}

.item{
    margin-top:16px;
    padding:16px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:#fafafa;
}
.item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
}
.item-code{
    font-size:2.5em;
    text-align:center;
    margin:10px 0 4px;
}
.item-count{text-align:center;color:var(--muted)}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    color:#fff;
    padding:12px 20px;
    border-radius:999px;
    opacity:0;
    transition:.3s;
}
.toast.show{opacity:1}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:none;
    align-items:center;
    justify-content:center;
}
.modal-box{
    background:#fff;
    padding:24px;
    border-radius:16px;
    width:320px;
}
.modal-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
}
.modal-actions button{flex:1}
</style>
</head>

<body>
<div class="text-container">
<h2>🔐 2FA Authenticator</h2>

<div class="tabs">
    <div class="tab active" onclick="openTab(1)">⚡ Get 2FA</div>
    <div class="tab" onclick="openTab(2)">💾Authenticator Key</div>
</div>

<!-- TAB 1 -->
<div id="tab1" class="tab-content active">
    <textarea id="key1" placeholder="Nhập key 2FA" oninput="updateTab1()"></textarea>
    <div id="auth1" class="big-code"></div>
    <div id="count1" class="count"></div>
    <button class="btn-save" onclick="saveFromTab1()">💾 LƯU</button>
</div>

<!-- TAB 2 -->
<div id="tab2" class="tab-content">
    <input id="name2" placeholder="Tên tài khoản (tuỳ chọn)">
    <textarea id="key2" placeholder="Nhập key 2FA"></textarea>
    <button class="btn-save" onclick="saveKey()">💾 LƯU</button>
    <div id="list"></div>
</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>🔒 Nhập pass xoá</h3>
    <input id="passInput" type="password">
    <div class="modal-actions">
        <button onclick="closeModal()">HUỶ</button>
        <button class="btn-del" onclick="confirmDelete()">XOÁ</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let deleteIndex = null;
let lastCode = ""; 

/* TAB */
function openTab(n){
    document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===n-1));
    document.querySelectorAll(".tab-content").forEach((c,i)=>c.classList.toggle("active",i===n-1));
}

/* TOAST */
function showToast(m){
    const toast = document.getElementById("toast");
    toast.textContent = m;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
}

/* TOTP LOGIC */
function base32tohex(b){
    const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";let bits="",hex="";
    for(let x of b.replace(/\s/g, "").replace(/=+/g,"")){
        const v=c.indexOf(x.toUpperCase());
        if(v>=0) bits+=v.toString(2).padStart(5,"0");
    }
    for(let i=0;i+8<=bits.length;i+=8)
        hex+=parseInt(bits.substr(i,8),2).toString(16).padStart(2,"0");
    return hex;
}

function totp(secret){
    const cleanSecret = secret.replace(/\s/g, "");
    const t=Math.floor(Date.now()/1000/30).toString(16).padStart(16,"0");
    const s=new jsSHA("SHA-1","HEX");
    s.setHMACKey(base32tohex(cleanSecret),"HEX");
    s.update(t);
    const h=s.getHMAC("HEX");
    const o=parseInt(h.slice(-1),16);
    return ((parseInt(h.substr(o*2,8),16)&0x7fffffff)%1e6).toString().padStart(6,"0");
}

function remain(){return 30-(Date.now()/1000%30|0)}

/* TAB 1: TỰ ĐỘNG XỬ LÝ KHI DÁN */
function updateTab1() {
    const textarea = document.getElementById("key1");
    let val = textarea.value;
    
    // Tự động làm sạch key nếu có khoảng trắng
    if (/\s/.test(val)) {
        val = val.replace(/\s/g, "");
        textarea.value = val;
    }

    const auth1 = document.getElementById("auth1");
    const count1 = document.getElementById("count1");

    if (!val) {
        auth1.textContent = "";
        count1.textContent = "";
        lastCode = "";
        return;
    }

    try {
        const currentCode = totp(val);
        auth1.textContent = currentCode;
        count1.textContent = "Còn " + remain() + "s";

        // Tự động copy
        if (currentCode !== lastCode) {
            navigator.clipboard.writeText(currentCode).then(() => {
                showToast("📋 Đã tự động copy: " + currentCode);
                lastCode = currentCode;
            });
        }
    } catch (e) {
        auth1.textContent = "Key lỗi";
    }
}

/* CÁC HÀM KHÁC */
function saveFromTab1(){
    const keyVal = document.getElementById("key1").value.trim();
    if(!keyVal) return showToast("❌ Chưa có key");
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.push({name:"",key:keyVal});
    localStorage.setItem("keys",JSON.stringify(d));
    showToast("✅ Đã lưu sang TAB 2");
    openTab(2);
    render();
}

function saveKey(){
    const name = document.getElementById("name2").value;
    const key = document.getElementById("key2").value.replace(/\s/g, "");
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.push({name:name,key:key});
    localStorage.setItem("keys",JSON.stringify(d));
    document.getElementById("name2").value="";
    document.getElementById("key2").value="";
    render();
}

function render(){
    const list = document.getElementById("list");
    list.innerHTML="";
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.forEach((x,i)=>{
        const title=x.name?.trim()?x.name:x.key;
        const e=document.createElement("div");
        e.className="item";
        e.innerHTML=`
            <div class="item-head">
                <span style="word-break:break-all">${title}</span>
                <div>
                    <button class="btn-copy">COPY</button>
                    <button class="btn-del">XOÁ</button>
                </div>
            </div>
            <div class="item-code"></div>
            <div class="item-count"></div>
        `;
        e.querySelector(".btn-copy").onclick=()=>{
            const c=totp(x.key);
            navigator.clipboard.writeText(c);
            showToast("📋 Đã copy "+c);
        };
        e.querySelector(".btn-del").onclick=()=>{
            deleteIndex=i;
            document.getElementById("passInput").value="";
            document.getElementById("modal").style.display="flex";
        };
        list.appendChild(e);
    });
}

function updateTab2(){
    document.querySelectorAll(".item").forEach((el,i)=>{
        const d=JSON.parse(localStorage.getItem("keys")||"[]");
        if(!d[i])return;
        el.querySelector(".item-code").textContent=totp(d[i].key);
        el.querySelector(".item-count").textContent="Còn "+remain()+"s";
    });
}

function closeModal(){document.getElementById("modal").style.display="none"}
function confirmDelete(){
    if(document.getElementById("passInput").value!=="123") return showToast("❌ Sai pass");
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.splice(deleteIndex,1);
    localStorage.setItem("keys",JSON.stringify(d));
    closeModal();render();
    showToast("🗑 Đã xoá");
}

/* LOOP */
setInterval(()=>{updateTab1();updateTab2();},1000);
render();
</script>
</body>
</html>
