<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            margin-bottom: 20px;
        }

        .countdown {
            margin-top: 10px;
            font-size: 1.2em;
            color: #555;
            text-align: center;
            display: none; /* Ẩn thời gian đếm ngược khi chưa có key */
        }

        #auth-code {
            font-size: 2em;
            text-align: center;
            display: block;
            margin-top: 20px;
            color: #333;
            cursor: pointer;
            user-select: none;
        }

        .btn-clear {
            padding: 10px;
            font-size: 1.1em;
            background-color: #dc3545;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-clear:hover {
            background-color: #c82333;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha.js"></script>
</head>
<body>

    <div class="container">
        <h2>2FA Authentication</h2>
        <textarea id="secret-key" rows="5" placeholder="Nhập hoặc dán Key 2FA..."></textarea>
        <p><strong id="auth-code"></strong></p>
        <span class="countdown" id="countdown">Thời gian còn lại: 30s</span>
        <button type="button" onclick="clearInput()" class="btn-clear">XÓA</button>
    </div>

    <script>
        function base32tohex(base32) {
            const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let bits = "";
            let hex = "";

            for (let i = 0; i < base32.length; i++) {
                const val = base32chars.indexOf(base32.charAt(i).toUpperCase());
                if (val !== -1) {
                    bits += val.toString(2).padStart(5, '0');
                }
            }

            while (bits.length % 8 !== 0) {
                bits += '0';
            }

            for (let i = 0; i < bits.length; i += 8) {
                const byte = bits.substr(i, 8);
                hex += parseInt(byte, 2).toString(16).padStart(2, '0');
            }

            return hex;
        }

        function generateTOTP(secret) {
            try {
                const epoch = Math.floor(Date.now() / 1000);
                const time = Math.floor(epoch / 30).toString(16).padStart(16, '0');

                const key = base32tohex(secret);
                const shaObj = new jsSHA("SHA-1", "HEX");
                shaObj.setHMACKey(key, "HEX");
                shaObj.update(time);

                const hmac = shaObj.getHMAC("HEX");

                const offset = parseInt(hmac.substring(hmac.length - 1), 16);
                const binary = parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff;
                const otp = (binary % 1000000).toString().padStart(6, '0');

                return otp;
            } catch (error) {
                console.error('Error generating TOTP:', error);
                return null;
            }
        }

        // Hàm cập nhật mã TOTP và tự động sao chép
        function updateCode() {
            const secretInput = document.getElementById('secret-key');
            const secret = secretInput.value.trim().replace(/\s+/g, ''); // Loại bỏ khoảng trắng
            const codeElement = document.getElementById('auth-code');
            const countdownElement = document.getElementById('countdown');

            if (secret.length === 0) {
                codeElement.textContent = '';
                countdownElement.style.display = 'none'; // Ẩn thời gian đếm ngược
                return;
            }

            const code = generateTOTP(secret);
            if (code) {
                codeElement.textContent = code;
                countdownElement.style.display = 'block'; // Hiển thị thời gian đếm ngược

                // Tự động sao chép mã TOTP vào clipboard
                navigator.clipboard.writeText(code)
                    .then(() => {
                        console.log('Mã TOTP đã được sao chép!');
                    })
                    .catch(err => {
                        console.error('Không thể sao chép mã TOTP: ', err);
                    });
            } else {
                codeElement.textContent = 'Key không hợp lệ';
                countdownElement.style.display = 'none'; // Ẩn thời gian đếm ngược nếu key không hợp lệ
            }
        }

        // Hàm xóa dữ liệu
        function clearInput() {
            document.getElementById('secret-key').value = '';
            document.getElementById('auth-code').textContent = '';
            document.getElementById('countdown').textContent = '';
            document.getElementById('countdown').style.display = 'none'; // Ẩn thời gian đếm ngược
        }

        // Hàm cập nhật thời gian đếm ngược
        function updateCountdown() {
            const countdownElement = document.getElementById('countdown');
            const secretInput = document.getElementById('secret-key');
            const secret = secretInput.value.trim().replace(/\s+/g, '');

            if (secret.length === 0) {
                countdownElement.style.display = 'none'; // Ẩn thời gian đếm ngược nếu không có key
                return;
            }

            const epoch = Math.floor(Date.now() / 1000);
            const timeRemaining = 30 - (epoch % 30);
            countdownElement.textContent = `Thời gian còn lại: ${timeRemaining}s`;
            countdownElement.style.display = 'block'; // Hiển thị thời gian đếm ngược
        }

        // Lắng nghe sự kiện thay đổi trong ô nhập liệu
        document.getElementById('secret-key').addEventListener('input', function () {
            updateCode(); // Cập nhật mã TOTP khi có sự thay đổi
            updateCountdown(); // Cập nhật thời gian đếm ngược khi key thay đổi

            // Tự động sao chép auth-code ngay sau khi mã TOTP được tạo
            const codeElement = document.getElementById('auth-code');
            const code = codeElement.textContent.trim();
            if (code && code !== '' && code !== 'Key không hợp lệ') {
                navigator.clipboard.writeText(code)
                    .then(() => {
                        console.log('Mã TOTP đã được sao chép tự động!');
                    })
                    .catch(err => {
                        console.error('Không thể sao chép mã TOTP: ', err);
                    });
            }
        });

        // Cập nhật mã TOTP và thời gian đếm ngược mỗi giây
        setInterval(function () {
            const secretInput = document.getElementById('secret-key');
            const secret = secretInput.value.trim().replace(/\s+/g, '');
            if (secret) {
                updateCode();
                updateCountdown();
            }
        }, 1000);

        // Lắng nghe sự kiện click trên auth-code để sao chép khi nhấp vào mã
        document.getElementById('auth-code').addEventListener('click', function () {
            const code = this.textContent.trim();
            if (code && code !== 'Key không hợp lệ') {
                navigator.clipboard.writeText(code)
                    .then(() => {
                        console.log('Mã TOTP đã được sao chép!');
                    })
                    .catch(err => {
                        console.error('Không thể sao chép mã TOTP: ', err);
                    });
            }
        });

        // Hàm tự động dán nội dung từ clipboard vào ô nhập liệu
        <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2FA Authenticator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha.js"></script>

<style>
:root{
    --bg:#f3f4f6;
    --card:#fff;
    --primary:#22c55e;
    --blue:#3b82f6;
    --red:#ef4444;
    --muted:#6b7280;
    --border:#e5e7eb;
    --radius:14px;
    --shadow:0 10px 25px rgba(0,0,0,.1);
}
*{box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    background:linear-gradient(180deg,#eef2ff,#f3f4f6);
    padding:20px;
}
.container{
    max-width:900px;
    margin:auto;
    background:var(--card);
    padding:24px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}
h2{text-align:center;margin-bottom:14px}

.tabs{
    display:flex;
    gap:6px;
    background:#e5e7eb;
    padding:6px;
    border-radius:999px;
}
.tab{
    flex:1;
    padding:10px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
    border-radius:999px;
}
.tab.active{
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.tab-content{display:none;margin-top:20px}
.tab-content.active{display:block}

input,textarea{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    margin-top:10px;
}
.big-code{
    font-size:3em;
    font-weight:800;
    text-align:center;
    margin-top:20px;
    cursor:pointer;
}
.count{text-align:center;color:var(--muted)}

button{
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}
.btn-save{background:var(--primary);color:#fff}
.btn-copy{background:var(--blue);color:#fff}
.btn-del{background:var(--red);color:#fff}

.item{
    margin-top:16px;
    padding:16px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:#fafafa;
}
.item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
}
.item-code{
    font-size:2.5em;
    text-align:center;
    margin:10px 0 4px;
}
.item-count{text-align:center;color:var(--muted)}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    color:#fff;
    padding:12px 20px;
    border-radius:999px;
    opacity:0;
    transition:.3s;
}
.toast.show{opacity:1}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:none;
    align-items:center;
    justify-content:center;
}
.modal-box{
    background:#fff;
    padding:24px;
    border-radius:16px;
    width:320px;
}
.modal-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
}
.modal-actions button{flex:1}
</style>
</head>

<body>
<div class="text-container">
<h2>🔐 2FA Authenticator</h2>

<div class="tabs">
    <div class="tab active" onclick="openTab(1)">⚡ Get 2FA</div>
    <div class="tab" onclick="openTab(2)">💾Authenticator Key</div>
</div>

<!-- TAB 1 -->
<div id="tab1" class="tab-content active">
    <textarea id="key1" placeholder="Nhập key (không tự lưu)"></textarea>
    <div id="auth1" class="big-code"></div>
    <div id="count1" class="count"></div>
    <button class="btn-save" onclick="saveFromTab1()">💾 LƯU</button>
</div>

<!-- TAB 2 -->
<div id="tab2" class="tab-content">
    <input id="name2" placeholder="Tên tài khoản (tuỳ chọn)">
    <textarea id="key2" placeholder="Nhập key để lưu"></textarea>
    <button class="btn-save" onclick="saveKey()">💾 LƯU</button>
    <div id="list"></div>
</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>🔒 Nhập pass xoá</h3>
    <input id="passInput" type="password">
    <div class="modal-actions">
        <button onclick="closeModal()">HUỶ</button>
        <button class="btn-del" onclick="confirmDelete()">XOÁ</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let deleteIndex=null;

/* TAB */
function openTab(n){
    document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===n-1));
    document.querySelectorAll(".tab-content").forEach((c,i)=>c.classList.toggle("active",i===n-1));
}

/* TOAST */
function showToast(m){
    toast.textContent=m;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),2000);
}

/* TOTP */
function base32tohex(b){
    const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";let bits="",hex="";
    for(let x of b.replace(/=+/g,"")){
        const v=c.indexOf(x.toUpperCase());
        if(v>=0) bits+=v.toString(2).padStart(5,"0");
    }
    for(let i=0;i+8<=bits.length;i+=8)
        hex+=parseInt(bits.substr(i,8),2).toString(16).padStart(2,"0");
    return hex;
}
function totp(secret){
    const t=Math.floor(Date.now()/1000/30).toString(16).padStart(16,"0");
    const s=new jsSHA("SHA-1","HEX");
    s.setHMACKey(base32tohex(secret),"HEX");
    s.update(t);
    const h=s.getHMAC("HEX");
    const o=parseInt(h.slice(-1),16);
    return ((parseInt(h.substr(o*2,8),16)&0x7fffffff)%1e6).toString().padStart(6,"0");
}
function remain(){return 30-(Date.now()/1000%30|0)}

/* TAB1 */
function updateTab1(){
    if(!key1.value.trim()){auth1.textContent="";count1.textContent="";return;}
    auth1.textContent=totp(key1.value);
    count1.textContent="Còn "+remain()+"s";
}
auth1.onclick=()=>auth1.textContent&&(navigator.clipboard.writeText(auth1.textContent),showToast("📋 Đã copy "+auth1.textContent));

function saveFromTab1(){
    if(!key1.value.trim()) return showToast("❌ Chưa có key");
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.push({name:"",key:key1.value.trim()});
    localStorage.setItem("keys",JSON.stringify(d));
    showToast("✅ Đã lưu sang TAB 2");
    openTab(2);
    render();
}

/* TAB2 */
function saveKey(){
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.push({name:name2.value,key:key2.value});
    localStorage.setItem("keys",JSON.stringify(d));
    name2.value="";key2.value="";
    render();
}

function render(){
    list.innerHTML="";
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.forEach((x,i)=>{
        const title=x.name?.trim()?x.name:x.key;
        const e=document.createElement("div");
        e.className="item";
        e.innerHTML=`
            <div class="item-head">
                <span style="word-break:break-all">${title}</span>
                <div>
                    <button class="btn-copy">COPY</button>
                    <button class="btn-del">XOÁ</button>
                </div>
            </div>
            <div class="item-code"></div>
            <div class="item-count"></div>
        `;
        e.querySelector(".btn-copy").onclick=()=>{
            const c=totp(x.key);
            navigator.clipboard.writeText(c);
            showToast("📋 Đã copy "+c);
        };
        e.querySelector(".btn-del").onclick=()=>{
            deleteIndex=i;
            passInput.value="";
            modal.style.display="flex";
        };
        list.appendChild(e);
    });
}
function updateTab2(){
    document.querySelectorAll(".item").forEach((el,i)=>{
        const d=JSON.parse(localStorage.getItem("keys")||"[]");
        if(!d[i])return;
        el.querySelector(".item-code").textContent=totp(d[i].key);
        el.querySelector(".item-count").textContent="Còn "+remain()+"s";
    });
}

/* MODAL */
function closeModal(){modal.style.display="none"}
function confirmDelete(){
    if(passInput.value!=="123") return showToast("❌ Sai pass");
    const d=JSON.parse(localStorage.getItem("keys")||"[]");
    d.splice(deleteIndex,1);
    localStorage.setItem("keys",JSON.stringify(d));
    closeModal();render();
    showToast("🗑 Đã xoá");
}

/* LOOP */
setInterval(()=>{updateTab1();updateTab2();},1000);
render();
</script>

</body>
</html>
    </script>
</body>
</html>
