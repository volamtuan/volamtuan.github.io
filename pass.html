
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>📂 Tool Quét & Trích xuất</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>

<!-- JSZip + sql.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>

<style>
:root {
  --bg: #f6f8fa;
  --card: #fff;
  --muted: #6c757d;
  --accent: #17a2b8;
}
body { background: var(--bg); font-family: Inter, "Segoe UI", Arial, sans-serif; padding:18px; color:#222; }
.card { border: none; box-shadow: 0 6px 18px rgba(20,20,30,0.06); }
.left-col { max-height: 60vh; overflow:auto; border-right:1px solid #e6e9ee; }
.domain-row { padding:10px 12px; border-bottom:1px solid #f1f3f5; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.domain-row:hover { background:#eef9ff; }
.domain-row.active { background: #dff3ff; }
#accountList { max-height: 60vh; overflow:auto; background:#fff; border:1px solid #e6e9ee; border-radius:6px; padding:6px; }
.acc-item { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid #f5f6f7; font-family: monospace; font-size:13px; }
.acc-item .left { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:82%; }
.progress { height: 22px; }
#statusBox { background:#0b1320; color:#6ef08a; font-family:monospace; font-size:12px; padding:8px; border-radius:6px; max-height:6.5rem; overflow:auto; }
#sqlPreview { font-family:monospace; font-size:13px; }
.small-muted { color:var(--muted); font-size:13px; }
.controls-row > * { margin-right:8px; }
.search-autocomplete { position:relative; }
#autocompleteList { position:absolute; z-index:1200; background:#fff; border:1px solid #ddd; width:100%; max-height:220px; overflow:auto; display:none; border-radius:4px; }
#autocompleteList div { padding:8px; cursor:pointer; border-bottom:1px solid #f3f3f3; }
#autocompleteList div:hover { background:#f6f9fb; }
.badge-count { min-width:48px; text-align:center; }
.note { color:#666; font-size:13px; }

/* Notify bar */
#notifyBar {
    position: fixed;
    bottom: 10px;
    left: 10px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    border-radius: 4px;
    font-size: 14px;
    display: none;
    z-index: 99999;
}
</style>
</head>
<body>
<div class="text-container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">📂 
<i class="fas fa-bolt"></i> Super Tool All-in-One</h5>

      <span class="badge badge-secondary" id="totalCountBadge">Total: 0 accs</span>
    </div>

        <div class="col-md-4">
            <div class="input-zone">
                <label class="font-weight-bold"><i class="fad fa-file-import"></i> Chọn File</label>
                <input type="file" id="fileInput" multiple accept=".txt,.zip,.sqlite,.db,.log">
            </div>
        </div>
        <div class="col-md-4">
            <div class="input-zone">
                <label class="font-weight-bold"><i class="fad fa-folder-open"></i> Chọn Folder</label>
                <input type="file" id="folderInput" webkitdirectory directory multiple>
            </div>
        </div>

    <div class="row mt-3">
      <div class="col-md-9">
        <textarea id="manualInput" rows="4" class="form-control" placeholder="Nhập thủ công (mỗi dòng user|pass hoặc block URL/Username/Password)"></textarea>
        <div class="mt-2 d-flex align-items-center">
          <button class="btn btn-success mr-2" id="btnManual">Xử lý thủ công</button>
          <button class="btn btn-outline-primary mr-2" id="clearAllBtn">Xóa tất cả</button>
        </div>
      </div>

      <div class="col-md-3">
        <label class="font-weight-bold">Tiến độ / Log</label>
        <div class="mb-2">
          <div class="progress">
            <div id="progressBar" class="progress-bar bg-info" role="progressbar" style="width:0%">0%</div>
          </div>
        </div>
        <div id="statusBox"></div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-2" id="mainTabs">
    <li class="nav-item"><a class="nav-link active" data-toggle="tab" href="#tabResult">Kết quả & Lọc</a></li>
    <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#tabSql">SQL Preview</a></li>
  </ul>

  <div class="tab-content">
    <div id="tabResult" class="tab-pane fade show active">
      <div class="row">
        <!-- Left: search + domain list -->
        <div class="col-md-4 pr-0">
          <div class="card left-col p-0">
            <div class="p-3">
              <div class="search-autocomplete">
                <input id="searchDomainInput" class="form-control" placeholder="Tìm domain hoặc gõ để lọc..." />
                <div id="autocompleteList"></div>
              </div>
              <div class="d-flex mt-2 controls-row">
                <button id="copyAllDomainsBtn" class="btn btn-warning btn-sm">Copy All</button>
                <button id="exportAllBtn" class="btn btn-outline-success btn-sm">Export All</button>
                <div class="ml-auto small-muted">Domains: <span id="domainCount">0</span></div>
              </div>
            </div>

            <div id="domainListBody">
              <!-- domain rows injected here -->
            </div>
          </div>
        </div>

        <!-- Right: account list -->
        <div class="col-md-8">
          <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div>
                <h5 class="mb-0">Accounts <small class="text-muted" id="selectedDomainName">— chưa chọn domain</small></h5>
              </div>
              <div>
                <button id="copyDomainAllBtn" class="btn btn-info btn-sm" disabled>Copy domain</button>
                <button id="downloadDomainBtn" class="btn btn-outline-secondary btn-sm" disabled>Download domain</button>
              </div>
            </div>
            <div id="accountList" class="mb-2">
              <div class="text-center text-muted p-3">Chưa có domain được chọn</div>
            </div>
            <div class="d-flex justify-content-between">
              <div>
                <button id="removeDupBtn" class="btn btn-light btn-sm">Remove Duplicates</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="tabSql" class="tab-pane fade">
      <div class="card p-3">

        <textarea id="sqlPreview" rows="10" class="form-control" placeholder="dữ liệu trích xuất từ..."></textarea>
        <div class="mt-2">
          <button id="copySqlBtn" class="btn btn-primary btn-sm">Copy preview</button>
          <button id="exportSqlBtn" class="btn btn-outline-secondary btn-sm">Export preview</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Notify bar -->
<div id="notifyBar"></div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =============================================================
   Config & State
   ============================================================= */
const COLUMNS_CHECK = ["uid","pass","password","username","user","email","mail","cookie","token","passmail","mailrecovery"];
let SQL = null;
const domainAccounts = new Map();
let totalAccounts = 0;
let processedFiles = 0;

/* UI refs */
const statusBox = document.getElementById("statusBox");
const progressBar = document.getElementById("progressBar");
const totalBadge = document.getElementById("totalCountBadge");
const domainListBody = document.getElementById("domainListBody");
const domainCountSpan = document.getElementById("domainCount");
const sqlPreview = document.getElementById("sqlPreview");
const autocompleteList = document.getElementById("autocompleteList");

/* init sql.js */
initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/${file}` })
  .then(lib => { SQL = lib; logStatus("Hello loaded"); })
  .catch(e => logStatus("sql.js load error: " + e.message));

/* =============================================================
   Notify helper
   ============================================================= */
function showNotify(msg, timeout=1500) {
    const bar = document.getElementById("notifyBar");
    bar.innerText = msg;
    bar.style.display = "block";
    clearTimeout(window.__notifyTimer);
    window.__notifyTimer = setTimeout(() => { bar.style.display = "none"; }, timeout);
}

/* =============================================================
   UI Helpers
   ============================================================= */
function logStatus(msg) {
  const ts = new Date().toLocaleTimeString();
  statusBox.innerText = `[${ts}] ${msg}`;
}

function setProgress(current, total) {
  const pct = total ? Math.round((current/total)*100) : 0;
  progressBar.style.width = pct + "%";
  progressBar.textContent = pct + "%";
}

function setTotalBadge() { totalBadge.innerText = `Total: ${totalAccounts} accs`; }

function uniqArray(arr, keyFn) {
  const seen = new Set();
  return arr.filter(item => {
    const k = keyFn(item);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

/* =============================================================
   Add & parse
   ============================================================= */
function addAccount(user, pass, domain) {
  if (!user || !pass) return;
  domain = domain || (user.includes("@") ? user.split("@")[1].toLowerCase() : null);
  if (!domain || domain.length < 3 || domain.indexOf('.') === -1) return;

  if (!domainAccounts.has(domain)) domainAccounts.set(domain, []);
  const list = domainAccounts.get(domain);

  if (!list.some(a => a.user === user && a.pass === pass)) {
    list.push({ user, pass });
    totalAccounts++;
  }
}

function parseSingleLine(line) {
  if (!line) return null;
  line = line.trim();
  if (!line) return null;

  let sep = null;
  if (line.includes("|")) sep = "|";
  else if (line.includes(":")) sep = ":";
  else if (line.includes(";")) sep = ";";

  if (sep) {
    const parts = line.split(sep).map(p => p.trim()).filter(Boolean);
    if (parts.length >= 2) {
      return { user: parts[0], pass: parts[1] };
    }
  }

  const uMatch = line.match(/(?:email|user(?:name)?|login)[\s:=]*([^\s|;]+)/i);
  const pMatch = line.match(/(?:password|pass|pwd)[\s:=]*([^\s|;]+)/i);
  if (uMatch && pMatch) return { user: uMatch[1].trim(), pass: pMatch[1].trim() };

  return null;
}

function processMultiLineBlocks(lines) {
  for (let i=0;i<lines.length;i++){
    const l = lines[i].trim();
    if(!l) continue;
    if(l.toLowerCase().startsWith("url:")||l.toLowerCase().startsWith("host:")){
      let url = l.split(":").slice(1).join(":").trim();
      if(!/^https?:\/\//i.test(url)) url="http://"+url;
      let domain=null,user=null,pass=null;
      try{domain=new URL(url).hostname.replace(/^www\./,"").toLowerCase();}catch(e){}
      for(let j=1;j<=6;j++){
        if(i+j>=lines.length) break;
        const nx=lines[i+j];
        const um=nx.match(/^(?:username|user|email|login)[\s:=]*(.+)/i);
        const pm=nx.match(/^(?:password|pass|pwd)[\s:=]*(.+)/i);
        if(um) user=um[1].trim();
        if(pm) pass=pm[1].trim();
      }
      if(user && pass) addAccount(user,pass,domain);
    }
  }
}

function processTextContent(text) {
  if(!text) return;
  const lines = text.split(/\r?\n/);
  for(const line of lines){
    const acc=parseSingleLine(line);
    if(acc){
      const domain = acc.user.includes("@") ? acc.user.split("@")[1].toLowerCase() : null;
      addAccount(acc.user,acc.pass,domain);
    }
  }
  processMultiLineBlocks(lines);
}

/* =============================================================
   ZIP / SQLite / File Handlers
   ============================================================= */
async function processSQLiteBuffer(uint8arr, label = "") {
  if (!SQL) {
    logStatus("sql.js not ready — skipping SQLite: " + label);
    return;
  }
  try {
    const db = new SQL.Database(uint8arr);
    // Try deep query first (accounts table)
    try {
      const cols = ["uid","pass","fa2","cookie","email","passmail","mailrecovery","birthday","name"];
      const q = `SELECT ${cols.join(", ")} FROM accounts`;
      const res = db.exec(q);
      if (res.length) {
        const rows = res[0].values;
        const preview = rows.map(r => r.join("|")).join("\n");
        sqlPreview.value += preview + "\n";
        processTextContent(preview);
        logStatus(`Extracted ${rows.length} rows from accounts table in ${label}`);
      }
    } catch(e) {
      // ignore - table may not exist
    }

    // If nothing or to find more, enumerate tables
    try {
      const tRes = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
      const tables = tRes.length ? tRes[0].values.flat() : [];
      for (const t of tables) {
        try {
          const sample = db.exec(`SELECT * FROM "${t}" LIMIT 1`);
          if (!sample.length) continue;
          const cols = sample[0].columns.map(c => c.toLowerCase());
          const idxUser = cols.findIndex(c => c.includes("user") || c.includes("mail") || c.includes("login") || c === "uid");
          const idxPass = cols.findIndex(c => c.includes("pass") || c.includes("pwd"));
          if (idxUser !== -1 && idxPass !== -1) {
            const res = db.exec(`SELECT * FROM "${t}" LIMIT 50000`);
            if (!res.length) continue;
            const rows = res[0].values;
            const buf = [];
            for (const r of rows) {
              const u = String(r[idxUser] || "").trim();
              const p = String(r[idxPass] || "").trim();
              if (u && p) {
                let domain = null;
                if (u.includes("@")) domain = u.split("@")[1].toLowerCase();
                addAccount(u, p, domain);
                buf.push(`${u}|${p}`);
              }
            }
            if (buf.length) {
              sqlPreview.value += buf.slice(0, 200).join("\n") + "\n";
              logStatus(`Scanned ${buf.length} rows from table ${t}`);
            }
          }
        } catch(err) {
          // ignore table-level errors
        }
      }
    } catch(e) {
      // ignore
    }
    db.close();
  } catch(e) {
    logStatus("SQLite parse error: " + e.message);
  }
}


async function processZipFile(file){
  try{
    const zip=await JSZip.loadAsync(file);
    for(const entry of Object.values(zip.files)){
      if(entry.dir) continue;
      const n=entry.name.toLowerCase();
      if(n.endsWith(".txt")||n.endsWith(".log")||n.endsWith(".csv")){
        const txt=await entry.async("string");
        processTextContent(txt);
      }else if(n.endsWith(".sqlite")||n.endsWith(".db")){
        const arr=await entry.async("uint8array");
        await processSQLiteBuffer(arr,file.name+" -> "+entry.name);
      }
    }
    logStatus("Processed ZIP: "+file.name);
  }catch(e){ logStatus("ZIP error: "+file.name+" -> "+e.message);}
}

async function handleFile(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  showNotify(`Đang xử lý file: ${file.name}...`,2000);
  if(ext==="zip") await processZipFile(file);
  else if(ext==="sqlite"||ext==="db") {
    const arr=await file.arrayBuffer();
    await processSQLiteBuffer(new Uint8Array(arr),file.name);
  }else{
    const txt=await file.text();
    processTextContent(txt);
  }
  processedFiles++;
  setProgress(processedFiles, document.getElementById("fileInput").files.length);
  showNotify(`Xong file: ${file.name}`,1000);
  renderDomainList();
  setTotalBadge();
}

/* =============================================================
   Render UI
   ============================================================= */
function renderDomainList() {
  domainListBody.innerHTML="";
  let idx=0;
  for(const [d,list] of domainAccounts.entries()){
    const div=document.createElement("div");
    div.className="domain-row";
    div.dataset.domain=d;
    div.innerHTML=`<span>${d}</span><span class="badge badge-pill badge-count">${list.length}</span>`;
    div.addEventListener("click",()=>selectDomain(d));
    domainListBody.appendChild(div);
    idx++;
  }
  domainCountSpan.innerText=domainAccounts.size;
}

function selectDomain(domain){
  const rows=document.querySelectorAll(".domain-row");
  rows.forEach(r=>r.classList.remove("active"));
  const selRow=[...rows].find(r=>r.dataset.domain===domain);
  if(selRow) selRow.classList.add("active");
  document.getElementById("selectedDomainName").innerText=domain;
  document.getElementById("selectedDomainName").dataset.domain=domain;
  const list=domainAccounts.get(domain)||[];
  const accList=document.getElementById("accountList");
  accList.innerHTML="";
  if(list.length){
    list.slice(0,500).forEach(a=>{
      const d=document.createElement("div");
      d.className="acc-item";
      d.innerHTML=`<span class="left">${a.user}|${a.pass}</span>`;
      accList.appendChild(d);
    });
  } else accList.innerHTML='<div class="text-center text-muted p-3">Chưa có acc</div>';
  document.getElementById("copyDomainAllBtn").disabled = !list.length;
  document.getElementById("downloadDomainBtn").disabled = !list.length;
}

/* =============================================================
   Event Listeners
   ============================================================= */
document.getElementById("fileInput").addEventListener("change",(e)=>{
  const files=[...e.target.files];
  processedFiles=0;
  showNotify(`Đang quét ${files.length} file...`,1000);
  files.forEach(f=>handleFile(f));
});

document.getElementById("folderInput").addEventListener("change",(e)=>{
  const files=[...e.target.files];
  processedFiles=0;
  showNotify(`Đang quét thư mục (${files.length} file)...`,1000);
  files.forEach(f=>handleFile(f));
});

document.getElementById("btnManual").addEventListener("click",()=>{
  const txt=document.getElementById("manualInput").value;
  if(!txt) return showNotify("Chưa nhập dữ liệu thủ công");
  processTextContent(txt);
  renderDomainList();
  setTotalBadge();
  showNotify("Đã xử lý thủ công",1500);
});

document.getElementById("clearAllBtn").addEventListener("click",()=>{
  domainAccounts.clear();
  totalAccounts=0;
  renderDomainList();
  setTotalBadge();
  showNotify("Đã xóa tất cả dữ liệu",1500);
});

/* Copy / Export */
document.getElementById("copyAllDomainsBtn").addEventListener("click",()=>{
  let txt="";
  domainAccounts.forEach((arr)=>txt+=arr.map(a=>`${a.user}|${a.pass}`).join("\n")+"\n");
  if(!txt) return showNotify("Không có dữ liệu để copy");
  navigator.clipboard.writeText(txt).then(()=>showNotify(`Đã sao chép toàn bộ ${totalAccounts} accs`));
});

document.getElementById("exportAllBtn").addEventListener("click",()=>{
  let txt="";
  domainAccounts.forEach((arr)=>txt+=arr.map(a=>`${a.user}|${a.pass}`).join("\n")+"\n");
  if(!txt) return showNotify("Không có dữ liệu để export");
  const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`accounts_all_${Date.now()}.txt`; a.click();
  URL.revokeObjectURL(url);
  showNotify("Đã xuất toàn bộ accounts");
});

document.getElementById("copyDomainAllBtn").addEventListener("click",()=>{
  const domain=document.getElementById("selectedDomainName").dataset.domain;
  if(!domain) return showNotify("Chưa chọn domain");
  const list=domainAccounts.get(domain)||[];
  const txt=list.map(a=>`${a.user}|${a.pass}`).join("\n");
  navigator.clipboard.writeText(txt).then(()=>showNotify(`Đã sao chép ${list.length} dòng từ ${domain}`));
});

document.getElementById("downloadDomainBtn").addEventListener("click",()=>{
  const domain=document.getElementById("selectedDomainName").dataset.domain;
  if(!domain) return showNotify("Chưa chọn domain");
  const list=domainAccounts.get(domain)||[];
  const blob=new Blob([list.map(a=>`${a.user}|${a.pass}`).join("\n")],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`${domain}_accounts_${Date.now()}.txt`; a.click();
  URL.revokeObjectURL(url);
  showNotify(`Đã tải về file ${domain}_accounts`);
});

document.getElementById("removeDupBtn").addEventListener("click",()=>{
  const combined=[];
  domainAccounts.forEach((arr,d)=>arr.forEach(a=>combined.push({domain:d,user:a.user,pass:a.pass})));
  const uniq=uniqArray(combined,x=>`${x.domain}|${x.user}|${x.pass}`);
  domainAccounts.clear(); totalAccounts=0;
  for(const it of uniq){
    if(!domainAccounts.has(it.domain)) domainAccounts.set(it.domain,[]);
    domainAccounts.get(it.domain).push({user:it.user,pass:it.pass});
    totalAccounts++;
  }
  renderDomainList(); setTotalBadge();
  showNotify(`Removed duplicates. Total now: ${totalAccounts}`);
});

document.getElementById("copySqlBtn").addEventListener("click",()=>{
  const t=sqlPreview.value;
  if(!t) return showNotify("Không có preview SQL");
  navigator.clipboard.writeText(t).then(()=>showNotify("Đã sao chép SQL preview"));
});

document.getElementById("exportSqlBtn").addEventListener("click",()=>{
  const t=sqlPreview.value;
  if(!t) return showNotify("Không có preview SQL");
  const blob=new Blob([t],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`sql_preview_${Date.now()}.txt`; a.click();
  URL.revokeObjectURL(url);
  showNotify("Đã xuất SQL preview");
});

/* Search filter + autocomplete */
document.getElementById("searchDomainInput").addEventListener("input",(e)=>{
  const v=e.target.value.toLowerCase();
  const rows=document.querySelectorAll(".domain-row");
  let visible=0;
  rows.forEach(r=>{
    const txt=r.dataset.domain.toLowerCase();
    if(txt.includes(v)){ r.style.display="flex"; visible++; }
    else r.style.display="none";
  });
  autocompleteList.style.display=visible? "block":"none";
});

/* =============================================================
   Done — ready
   ============================================================= */
showNotify("Tool ready!",1200);
</script>
</body>
</html>
